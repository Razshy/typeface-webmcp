<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Proof of Typeface — proof origin</title>
<script src="/kit/mc.js"></script>
<style>
  :root { color-scheme: light; }
  body { margin: 0; font: 12px/1.5 ui-monospace, "SFMono-Regular", Menlo, monospace; color: #241f1b; background: #f7f4ee; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-bottom: 1px solid #d9d2c4; background: #fffdf8; }
  .seal { font: 700 10px/1 ui-monospace, monospace; letter-spacing: .14em; text-transform: uppercase; color: #7b1c13; border: 1.5px solid #7b1c13; border-radius: 2px; padding: 4px 6px; }
  .meta { color: #7a7264; }
  #log { padding: 6px 12px; max-height: 96px; overflow: auto; }
  #log div { border-bottom: 1px dotted #ddd6c8; padding: 3px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { color: #8a6d1f; }
  .ok { color: #1c6b45; }
  /* stamp-style certificate */
  #cert {
    margin: 12px; padding: 12px 14px; background: #fffef9; border: 2px solid #241f1b; position: relative;
    box-shadow: 4px 4px 0 rgba(36,31,27,.12);
  }
  #cert:before { content: ""; position: absolute; inset: 4px; border: 1px solid #cfc6b2; pointer-events: none; }
  #cert .cap { font: 700 9px/1 ui-monospace, monospace; letter-spacing: .22em; text-transform: uppercase; color: #7a7264; }
  #cert .head { font: 400 15px/1.2 Georgia, serif; margin: 6px 46px 4px 0; }
  #cert .head b { font-style: italic; }
  #cert .who { font: 400 13px/1.3 Georgia, serif; margin: 2px 0 6px; }
  #cert .hashes { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 12px; font-size: 10.5px; }
  #cert .hashes span { color: #7a7264; }
  #cert .hashes b { font-weight: 400; font-family: ui-monospace, monospace; }
  #cert .stamp {
    position: absolute; right: 9px; top: 9px; font: 700 9px/1.2 ui-monospace, monospace; letter-spacing: .08em;
    text-transform: uppercase; border: 2px solid currentColor; padding: 5px 6px; border-radius: 2px;
    transform: rotate(-7deg); width: 62px; text-align: center; background: rgba(255,255,255,.75);
  }
  #cert .stamp.red { color: #8c1d12; }
  #cert .stamp.green { color: #1d6a46; }
</style>
</head>
<body>
<div class="bar">
  <span class="seal">Proof origin</span>
  <span class="meta">glyph-hash + wrap-fingerprint lab · <span id="origin">self: …</span></span>
</div>
<div id="cert">
  <div class="cap">Proof of Typeface · issued by the proof origin</div>
  <div class="head">PROOF: <b id="cert-verdict">the face you asked for ≠ the face you got</b></div>
  <div class="who">Face under scrutiny: <span id="cert-family">—</span> · size <span id="cert-size">—</span></div>
  <div class="hashes">
    <div><span>requested hash</span> <b id="cert-hash">—</b></div>
    <div><span>matched stand-in</span> <b id="cert-standin">—</b></div>
    <div><span>ink</span> <b id="cert-ink">—</b></div>
    <div><span>width</span> <b id="cert-width">—</b></div>
  </div>
  <div class="stamp" id="cert-stamp">pending</div>
</div>
<div id="log"><div class="meta">awaiting measurements…</div></div>
<script type="module">
import * as E from './engine.js';

const MAIN = window.MC.origin('main');
const SELF = window.__MC_SELF || window.location.origin;
document.getElementById('origin').textContent = 'self ' + SELF;

function log(tool, detail, kind) {
  const el = document.createElement('div');
  el.innerHTML = '<span class="tag">' + tool + '</span> <span class="' + (kind || '') + '">' + detail + '</span>';
  const first = document.getElementById('log').firstElementChild;
  if (first && first.textContent.indexOf('awaiting') === 0) first.remove();
  document.getElementById('log').prepend(el);
  window.__calls.push({ tool, detail: String(detail).slice(0, 160), at: Date.now() });
}
window.__calls = [];
window.__verdicts = [];
window.__lastCall = null;
window.__registered = [];

const SIZE_DEFAULT = 26;
const COLUMN_DEFAULT = 420;
const SAMPLE = 'Handgloves 2026';

const ac = new AbortController();

async function register(def) {
  await window.mc.registerTool(def, { exposedTo: [MAIN], signal: ac.signal });
  window.__registered.push(def.name);
}

/* proof_glyph_hash — render `text` in the requested family and against three generic
 * stand-ins, and report whether the browser actually obeyed the family. */
async function proofGlyphHash(input) {
  const text = String(input.text ?? SAMPLE);
  const family = String(input.family ?? 'Arial');
  const size = Number(input.size ?? SIZE_DEFAULT);
  const v = E.hashVerdict(text, family, size);
  const payload = Object.assign({ originLabel: 'proof', origin: SELF, text, size, check: E.fontCheck(family, size) }, v);
  payload.verdict = v.identical
    ? 'proof:substituted — declared ' + family + ' rasterises identical to ' + v.fallbackHash
    : 'proof:own-outlines — declared ' + family + ' rasterises to its own hash';
  window.__verdicts.push(payload);
  renderCert(payload);
  log('proof_glyph_hash', family + ' → ' + v.requestedHash + (v.identical ? ' SUBST' : ' own'), v.identical ? '' : 'ok');
  return payload;
}

function renderCert(p) {
  const el = document.getElementById('cert');
  if (!el) return;
  el.className = p.identical ? 'bad' : 'good';
  document.getElementById('cert-verdict').textContent = p.identical
    ? 'the face you asked for ≠ the face you got'
    : 'the face you asked for is the face you got';
  document.getElementById('cert-family').textContent = p.requestedFamily;
  document.getElementById('cert-hash').textContent = p.requestedHash;
  document.getElementById('cert-standin').textContent = p.identical ? p.fallbackHash : '— (no match)';
  document.getElementById('cert-ink').textContent = p.inkPx + ' px';
  document.getElementById('cert-width').textContent = p.widthPx + ' px';
  document.getElementById('cert-size').textContent = p.size + ' px';
  document.getElementById('cert-stamp').textContent = p.identical ? 'SUBSTITUTED' : 'PROVEN';
  document.getElementById('cert-stamp').className = 'stamp ' + (p.identical ? 'red' : 'green');
}

/* proof_metrics — measureText width plus the wrap fingerprint (line right edges + median)
 * for the declared family and the export substitute, with the deltas. */
async function proofMetrics(input) {
  const text = String(input.text ?? SAMPLE);
  const family = String(input.family ?? 'Arial');
  const size = Number(input.size ?? SIZE_DEFAULT);
  const columnPx = Number(input.widthPxColumn ?? COLUMN_DEFAULT);
  const declared = E.wrapFingerprint(text, family, size, columnPx);
  const sub = E.exportSubstitute(family);
  const under = E.wrapFingerprint(text, sub, size, columnPx);
  const req = E.glyphRaster(family, size, text);
  const payload = {
    originLabel: 'proof',
    origin: SELF,
    text, family, size, columnPx,
    widthPx: req.widthPx,
    declared,
    substituteFamily: sub,
    underSubstitute: under,
    widthDeltaPct: E.pctDelta(declared.widthPx, under.widthPx),
    medianRightEdgeDeltaPct: E.pctDelta(declared.medianRightEdge, under.medianRightEdge),
    lineDelta: under.lineCount - declared.lineCount,
    fingerprintChanged: declared.fingerprint !== under.fingerprint,
    verdict: declared.fingerprint === under.fingerprint
      ? 'proof:wrap-stable under export substitute'
      : 'proof:wrap-shifts under export substitute (' + sub + ')'
  };
  log('proof_metrics', family + ' ' + declared.lineCount + '→' + under.lineCount + ' lines, Δw ' + payload.widthDeltaPct + '%');
  return payload;
}

/* proof_compare — side-by-side raster of two families over the same string. */
async function proofCompare(input) {
  const text = String(input.text ?? SAMPLE);
  const a = String(input.familyA ?? 'Georgia');
  const b = String(input.familyB ?? 'Times New Roman');
  const size = Number(input.size ?? SIZE_DEFAULT);
  const ra = E.glyphRaster(a, size, text);
  const rb = E.glyphRaster(b, size, text);
  const payload = {
    originLabel: 'proof', origin: SELF, text, size,
    a: Object.assign({ family: a }, ra),
    b: Object.assign({ family: b }, rb),
    identical: ra.hash === rb.hash,
    inkRatio: ra.inkPx ? E.round2(rb.inkPx / ra.inkPx) : null,
    widthDeltaPct: E.pctDelta(ra.widthPx, rb.widthPx),
    verdict: ra.hash === rb.hash
      ? 'proof:indistinguishable — ' + a + ' and ' + b + ' put identical pixels on glass'
      : 'proof:distinguishable — different outlines'
  };
  log('proof_compare', a + ' vs ' + b + (ra.hash === rb.hash ? ' IDENTICAL' : ' differ'), ra.hash === rb.hash ? '' : 'ok');
  return payload;
}

/* proof_font_check — the lie detector itself: what fonts.check() claims vs what rendered. */
async function proofFontCheck(input) {
  const family = String(input.family ?? 'Arial');
  const size = Number(input.size ?? SIZE_DEFAULT);
  const claim = E.fontCheck(family, size);
  const v = E.hashVerdict(SAMPLE, family, size);
  const payload = {
    originLabel: 'proof', origin: SELF, family, size,
    fontsCheck: claim,
    checkSaysInstalled: claim.declared,
    glyphHash: v.requestedHash,
    matchesGeneric: v.identical,
    standin: v.fallbackFamily,
    lie: claim.declared === true && v.identical === true,
    verdict: claim.declared === true && v.identical === true
      ? 'proof:lie — fonts.check says ' + family + ' is installed, pixels say generic fallback'
      : 'proof:no-contradiction'
  };
  log('proof_font_check', family + ' check=' + claim.declared + (payload.lie ? ' LIE' : ''), payload.lie ? '' : 'ok');
  return payload;
}

/* proof_export_preview — which face an export pipeline would embed, and what that does. */
async function proofExportPreview(input) {
  const text = String(input.text ?? SAMPLE);
  const family = String(input.family ?? 'Arial');
  const size = Number(input.size ?? SIZE_DEFAULT);
  const sub = E.exportSubstitute(family);
  const declared = E.hashVerdict(text, family, size);
  const embedded = E.hashVerdict(text, sub, size);
  const payload = {
    originLabel: 'proof', origin: SELF, text, family, size,
    declared,
    embeddedFamily: sub,
    embeddedHash: embedded.requestedHash,
    embeddedIsGeneric: embedded.identical,
    rasterUnchanged: embedded.requestedHash === declared.requestedHash,
    widthDeltaPct: E.pctDelta(declared.widthPx, embedded.widthPx),
    modelledBy: 'EXPORT_STACK (modelled pipeline, measured consequences)',
    verdict: 'proof:export would embed ' + sub + (embedded.identical ? ' (itself a generic fallback)' : '')
  };
  log('proof_export_preview', family + ' → ' + sub + (embedded.identical ? ' (generic)' : ''));
  return payload;
}

/* decoy_proof — same origin, deliberately NOT exposedTo anyone: invisible cross-origin. */
async function registerRest() {
  await register({
    name: 'proof_glyph_hash',
    title: 'Glyph hash proof',
    description: 'Rasterise `text` in `family` on an offscreen canvas and hash the pixels, then do the same for three generic stand-ins (serif, Arial-as-generic-sans, monospace, sans-serif). Returns {requestedHash, fallbackHash, identical, inkPx, widthPx}: identical=true means the browser ignored the declared family and substituted a fallback.',
    inputSchema: {
      type: 'object',
      properties: {
        text: { type: 'string', description: 'Text to rasterise. Default "' + SAMPLE + '".' },
        family: { type: 'string', description: "Declared CSS font-family, e.g. 'Georgia'." },
        size: { type: 'number', description: 'Font size in CSS px. Default ' + SIZE_DEFAULT + '.' }
      },
      required: ['family']
    },
    annotations: { readOnlyHint: true, openWorldHint: false },
    execute: proofGlyphHash
  });
  await register({
    name: 'proof_metrics',
    title: 'Metrics + wrap fingerprint',
    description: 'measureText width for (text, family, size) plus a wrap fingerprint at widthPxColumn: lines[], per-line right edges and medianRightEdge, measured under the declared family and again under the face an export pipeline would substitute. Returns widthDeltaPct / medianRightEdgeDeltaPct / lineDelta.',
    inputSchema: {
      type: 'object',
      properties: {
        text: { type: 'string', description: 'Paragraph text to wrap.' },
        family: { type: 'string', description: 'Declared CSS font-family.' },
        size: { type: 'number', description: 'Font size in CSS px. Default ' + SIZE_DEFAULT + '.' },
        widthPxColumn: { type: 'number', description: 'Column width in px to wrap against. Default ' + COLUMN_DEFAULT + '.' }
      },
      required: ['family']
    },
    annotations: { readOnlyHint: true, openWorldHint: false },
    execute: proofMetrics
  });
  await register({
    name: 'proof_compare',
    title: 'Compare two faces',
    description: 'Rasterise the same string twice, once per family, and report whether the pixels are identical (proof_compare is how you prove two family names resolve to one face).',
    inputSchema: {
      type: 'object',
      properties: {
        text: { type: 'string', description: 'Text to rasterise.' },
        familyA: { type: 'string', description: 'First family.' },
        familyB: { type: 'string', description: 'Second family.' },
        size: { type: 'number', description: 'Font size in CSS px.' }
      },
      required: ['familyA', 'familyB']
    },
    annotations: { readOnlyHint: true, openWorldHint: false },
    execute: proofCompare
  });
  await register({
    name: 'proof_font_check',
    title: 'fonts.check vs pixels',
    description: 'Ask document.fonts.check() whether a family is available and compare that claim with the glyph hash. Returns lie=true when check() claims the face exists but it rasterises identical to a generic fallback.',
    inputSchema: {
      type: 'object',
      properties: {
        family: { type: 'string', description: 'Family to interrogate.' },
        size: { type: 'number', description: 'Font size in CSS px.' }
      },
      required: ['family']
    },
    annotations: { readOnlyHint: true, openWorldHint: false },
    execute: proofFontCheck
  });
  await register({
    name: 'proof_export_preview',
    title: 'Export face preview',
    description: 'Report which face the (modelled) export pipeline would embed for a declared family, hash it, and say whether the raster/width changes. This is the PDF-laundering preview.',
    inputSchema: {
      type: 'object',
      properties: {
        text: { type: 'string', description: 'Text to rasterise.' },
        family: { type: 'string', description: 'Declared family.' },
        size: { type: 'number', description: 'Font size in CSS px.' }
      },
      required: ['family']
    },
    annotations: { readOnlyHint: true, openWorldHint: false },
    execute: proofExportPreview
  });
  await window.mc.registerTool({
    name: 'decoy_proof',
    title: 'Decoy (not exposed)',
    description: 'Lives on the proof origin but is registered without exposedTo, so the main origin must never see it.',
    inputSchema: { type: 'object' },
    annotations: { readOnlyHint: true },
    execute: async () => ({ originLabel: 'proof', decoy: true })
  }, { signal: ac.signal });
  window.__registered.push('decoy_proof (unexposed)');
}

window.addEventListener('load', async () => {
  try {
    await registerRest();
    window.__proofHash = E.glyphRaster;
    window.__proofEngine = E;
    window.__appReady = true;
    log('ready', window.__registered.length + ' tools registered (5 exposed to main, 1 decoy)', 'ok');
  } catch (e) {
    window.__proofError = String(e);
    log('error', String(e));
  }
});
</script>
</body>
</html>
